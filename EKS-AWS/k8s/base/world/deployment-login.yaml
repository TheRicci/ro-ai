apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathena-login
  namespace: ro-ai-world
  labels:
    app.kubernetes.io/name: rathena-login
    app.kubernetes.io/part-of: ro-ai-world
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rathena-login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rathena-login
        app.kubernetes.io/part-of: ro-ai-world
    spec:
      serviceAccountName: ro-ai-world-service
      initContainers:
        - name: render-import-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              DB_HOST="$(cat /mnt/secrets-store/host)"
              DB_USER="$(cat /mnt/secrets-store/username)"
              DB_PASSWORD="$(cat /mnt/secrets-store/password)"
              DB_NAME="$(cat /mnt/secrets-store/database)"
              cat > /work/inter_conf.txt <<EOF
              login_server_ip: ${DB_HOST}
              login_server_port: 3306
              login_server_id: ${DB_USER}
              login_server_pw: ${DB_PASSWORD}
              login_server_db: ${DB_NAME}
              ipban_db_ip: ${DB_HOST}
              ipban_db_port: 3306
              ipban_db_id: ${DB_USER}
              ipban_db_pw: ${DB_PASSWORD}
              ipban_db_db: ${DB_NAME}
              char_server_ip: ${DB_HOST}
              char_server_port: 3306
              char_server_id: ${DB_USER}
              char_server_pw: ${DB_PASSWORD}
              char_server_db: ${DB_NAME}
              map_server_ip: ${DB_HOST}
              map_server_port: 3306
              map_server_id: ${DB_USER}
              map_server_pw: ${DB_PASSWORD}
              map_server_db: ${DB_NAME}
              log_db_ip: ${DB_HOST}
              log_db_port: 3306
              log_db_id: ${DB_USER}
              log_db_pw: ${DB_PASSWORD}
              log_db_db: ${DB_NAME}
              EOF
              printf "login_ip: rathena-login\nchar_ip: rathena-char\n" > /work/char_conf.txt
              printf "char_ip: rathena-char\nmap_ip: rathena-map\n" > /work/map_conf.txt
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: import-rendered
              mountPath: /work
      containers:
        - name: login
          image: ghcr.io/ro-ai/rathena:latest
          imagePullPolicy: IfNotPresent
          command:
            - /rathena/login-server
          ports:
            - name: login
              containerPort: 6900
          volumeMounts:
            - name: import-rendered
              mountPath: /rathena/conf/import/inter_conf.txt
              subPath: inter_conf.txt
            - name: import-rendered
              mountPath: /rathena/conf/import/char_conf.txt
              subPath: char_conf.txt
            - name: import-rendered
              mountPath: /rathena/conf/import/map_conf.txt
              subPath: map_conf.txt
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: login
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: login
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: import-rendered
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ro-ai-world-db
