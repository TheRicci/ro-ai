apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ro-ai-world-db
  namespace: ro-ai-world
spec:
  parameters:
    region: us-east-1
    objects: |
      - objectName: "ro-ai/dev/world-db"
        objectType: "secretsmanager"
        jmesPath:
          - path: "host"
            objectAlias: "host"
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
          - path: "database"
            objectAlias: "database"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ro-ai-intelligence-secrets
  namespace: ro-ai-intelligence
spec:
  parameters:
    region: us-east-1
    objects: |
      - objectName: "ro-ai/dev/intelligence"
        objectType: "secretsmanager"
        jmesPath:
          - path: "model_api_key"
            objectAlias: "model_api_key"
          - path: "model_base_url"
            objectAlias: "model_base_url"
          - path: "bot_memory_table"
            objectAlias: "bot_memory_table"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ro-ai-bot-runtime-secrets
  namespace: ro-ai-bots
spec:
  parameters:
    region: us-east-1
    objects: |
      - objectName: "ro-ai/dev/bot-runtime"
        objectType: "secretsmanager"
        jmesPath:
          - path: "account_username"
            objectAlias: "account_username"
          - path: "account_password"
            objectAlias: "account_password"
          - path: "control_token"
            objectAlias: "control_token"
